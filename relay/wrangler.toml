name = "riskprime-relay"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated, exact origins.
ALLOWED_ORIGINS = "https://OWNER.github.io,tauri://localhost,http://127.0.0.1:4174"
GITHUB_REPO = "OWNER/REPO"
GITHUB_APP_ID = "000000"
GITHUB_INSTALLATION_ID = "00000000"

# Secrets (never commit): wrangler secret put TURNSTILE_SECRET / GITHUB_APP_PRIVATE_KEY

[[unsafe.bindings]]
name = "PROPOSAL_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
