name: Proposal approve

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  approve:
    if: >-
      github.event.label.name == 'onaylandı' &&
      contains(github.event.issue.labels.*.name, 'madde-onerisi')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only the issue number is passed; the script fetches the body through the API.
      - id: add
        run: node scripts/proposal.mjs approve "$ISSUE_NUMBER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
      - run: pnpm bank:build
      - run: pnpm bank:check
      - run: pnpm test
      - id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: oneri/${{ github.event.issue.number }}
          title: "Madde önerisi #${{ github.event.issue.number }}: ${{ steps.add.outputs.key }}"
          commit-message: "feat: ${{ steps.add.outputs.key }} maddesi eklendi (öneri #${{ github.event.issue.number }})"
          body: "Closes #${{ github.event.issue.number }}"
      - run: gh issue comment "$ISSUE_NUMBER" --body "Pull request açıldı - $PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
